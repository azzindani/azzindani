<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="azzindani — open source gives freedom to everyone">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#edge)"/>

  <g font-family="DejaVu Sans, Verdana, Geneva, sans-serif">
    <text x="96" y="138" fill="#58a6ff" font-size="26" font-weight="600" letter-spacing="7">azzindani</text>

    <text x="96" y="286" fill="#e6edf3" font-size="68" font-weight="700">Open source gives</text>
    <text x="96" y="368" fill="#e6edf3" font-size="68" font-weight="700">freedom to everyone.</text>

    <text x="98" y="438" fill="#8b949e" font-size="30">Whatever I build, you can have the same.</text>

    <text x="98" y="556" fill="#6e7681" font-size="22" letter-spacing="1.2">github.com/azzindani</text>
  </g>

  <rect x="96" y="492" width="120" height="3" fill="#30363d"/>

  <!-- one becomes many: a solid mark, copied outward and fading -->
  <g>
    <rect x="940" y="200" width="40" height="40" rx="6" fill="#58a6ff"/>
    <g fill="none" stroke="#58a6ff" stroke-width="2">
      <rect x="1010" y="200" width="40" height="40" rx="6" opacity="0.62"/>
      <rect x="1080" y="200" width="40" height="40" rx="6" opacity="0.50"/>
      <rect x="1150" y="200" width="40" height="40" rx="6" opacity="0.38"/>
      <rect x="940"  y="270" width="40" height="40" rx="6" opacity="0.62"/>
      <rect x="1010" y="270" width="40" height="40" rx="6" opacity="0.50"/>
      <rect x="1080" y="270" width="40" height="40" rx="6" opacity="0.38"/>
      <rect x="1150" y="270" width="40" height="40" rx="6" opacity="0.28"/>
      <rect x="940"  y="340" width="40" height="40" rx="6" opacity="0.50"/>
      <rect x="1010" y="340" width="40" height="40" rx="6" opacity="0.38"/>
      <rect x="1080" y="340" width="40" height="40" rx="6" opacity="0.28"/>
      <rect x="1150" y="340" width="40" height="40" rx="6" opacity="0.20"/>
      <rect x="940"  y="410" width="40" height="40" rx="6" opacity="0.38"/>
      <rect x="1010" y="410" width="40" height="40" rx="6" opacity="0.28"/>
      <rect x="1080" y="410" width="40" height="40" rx="6" opacity="0.20"/>
      <rect x="1150" y="410" width="40" height="40" rx="6" opacity="0.13"/>
    </g>
  </g>
</svg>
