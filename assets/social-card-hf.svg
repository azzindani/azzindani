<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="azzindani — open datasets, open weights">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD21E"/>
      <stop offset="1" stop-color="#FFD21E" stop-opacity="0"/>
