    <text x="96" y="286" fill="#e6edf3" font-size="68" font-weight="700">Open datasets.</text>
    <text x="96" y="368" fill="#e6edf3" font-size="68" font-weight="700">Open weights.</text>

    <text x="98" y="438" fill="#8b949e" font-size="30">The foundation, and what's built on it —</text>
    <text x="98" y="478" fill="#8b949e" font-size="30">free to take.</text>

    <text x="98" y="576" fill="#6e7681" font-size="22" letter-spacing="1.2">huggingface.co/Azzindani</text>
  </g>

  <rect x="96" y="516" width="120" height="3" fill="#30363d"/>

