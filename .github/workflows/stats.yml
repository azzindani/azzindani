name: Statistics

# Regenerates the SVG cards in assets/ and commits them when the numbers move.
#
# Add a secret named STATS_TOKEN - a fine-grained personal access token,
# read-only, scoped to all repositories, granting "Metadata: read" and
# "Contents: read" - and the cards start counting private work too.
#
# Without it the job still renders, falling back to the Actions token and
# reporting public repositories only. The card says which it is, so the
# numbers are never overstated.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATS_LOGIN: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      # The secrets context is not available to a job-level `if`, so this only
      # reports which scope the run will use; the render happens either way.
      - name: Report scope
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::notice title=Public scope::STATS_TOKEN is not set, so the cards will count public repositories only. Add it under Settings > Secrets and variables > Actions to include private work."
          else
            echo "STATS_TOKEN found - private repositories included."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/langs-*.svg
          if git diff --cached --quiet; then
            echo "No change in the numbers."
          else
            git commit -m "Update statistics cards"
            git push
          fi
