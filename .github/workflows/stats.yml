name: Statistics

# Regenerates the SVG cards in assets/ and commits them when the numbers move.
#
# Needs a secret named STATS_TOKEN: a fine-grained personal access token,
# read-only, scoped to all repositories, granting "Metadata: read" and
# "Contents: read". That is what lets the query count private work - the
# built-in GITHUB_TOKEN cannot see outside this repository.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/langs-*.svg
          if git diff --cached --quiet; then
            echo "No change in the numbers."
          else
            git commit -m "Update statistics cards"
            git push
          fi
