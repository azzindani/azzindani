name: Statistics

# Regenerates the SVG cards in assets/ and commits them when the numbers move.
#
# Needs a secret named STATS_TOKEN: a fine-grained personal access token,
# read-only, scoped to all repositories, granting "Metadata: read" and
# "Contents: read". That is what lets the query count private work - the
# built-in GITHUB_TOKEN cannot see outside this repository.
#
# Without that secret the job skips with a notice rather than failing, so an
# unconfigured repo does not collect a red run every morning.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      STATS_LOGIN: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      # The secrets context is not available to a job-level `if`, so the check
      # happens here and gates the steps that follow.
      - name: Check for a token
        id: guard
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::notice title=Statistics not configured::STATS_TOKEN is not set, so there is nothing to render. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Render cards
        if: steps.guard.outputs.ready == 'true'
        run: python scripts/generate_stats.py

      - name: Commit if changed
        if: steps.guard.outputs.ready == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/langs-*.svg
          if git diff --cached --quiet; then
            echo "No change in the numbers."
          else
            git commit -m "Update statistics cards"
            git push
          fi
